# ── Kiểm cấu trúc (verify_release.py chạy lại được) ──────────────────────────
expect:
  n_questions: 2080
  docs_per_question: 5      # đúng 5 cho MỌI câu ở cả hai lượt, đã đo
  preds_depth: 10           # p4_to_preds --depth mặc định; make_submission dedupe RỒI cắt 5

# ── Bằng chứng về phiên bản mã nguồn đã chạy ─────────────────────────────────
# Hai lượt này chạy bằng các script lúc đó CHƯA commit (p5_knn_fuse.py commit lúc 10:10 ngày
# 23/09, mà knn_rrf.json sinh lúc 01:14 cùng ngày). Nên câu hỏi "bản đã chạy có đúng bản đang
# nằm trên main không" không trả lời được bằng git. Bằng chứng gián tiếp, đo được, ghi ở đây:
bang_chung:
  cach_do: >-
    Bytecode trong scripts/__pycache__/*.cpython-312.pyc ghi kèm KÍCH THƯỚC file nguồn tại
    thời điểm biên dịch (PEP 552, timestamp-based, flags=0). So kích thước đó với
    `git cat-file -s main:<file>`.
  ket_qua:
    p5_knn_fuse.py:      {pyc_bien_dich: "2026-09-23 01:13:57", nguon_size_pyc: 7326, size_tren_main: 7326, khop: true}
    p4_to_preds.py:      {pyc_bien_dich: "2026-09-16 23:15:20", nguon_size_pyc: 3015, size_tren_main: 3015, khop: true}
    p4_fuse.py:          {pyc_bien_dich: "2026-09-16 17:11:45", nguon_size_pyc: 7980, size_tren_main: 7980, khop: true}
    p4_check_submission.py: {pyc_bien_dich: "2026-09-16 23:23:44", nguon_size_pyc: 7054, size_tren_main: 7054, khop: true}
  gia_tri_cua_bang_chung: >-
    Khớp kích thước KHÔNG PHẢI khớp nội dung — hai file khác nhau vẫn có thể cùng số byte.
    Nhưng bytecode của p5_knn_fuse được biên dịch lúc 01:13:57, một phút trước khi
    knn_rrf.json ra đời lúc 01:14, và kích thước nguồn lúc đó bằng đúng kích thước bản trên
    main. Đọc nó là bằng chứng ủng hộ mạnh, không phải là chứng minh.
  __pycache__: >-
    Thư mục này nằm trong .gitignore và sẽ biến mất khi ai đó dọn máy. Bằng chứng ở trên được
    chép vào đây vì nó KHÔNG tái tạo được sau đó.

# ── Những chỗ còn hở, không vá lặng lẽ ───────────────────────────────────────
van_de:
  - id: C-khong-tag
    muc: cao
    mo_ta: >-
      Lượt C chưa có git tag. plan.md §1 đòi mọi submission thật sinh từ một tag. Cách vá:
      `git tag -a submission/2026-09-23-rrf-w06 bdfedf8 -m "private lượt C · recall <x> · precision <y>"`
      — dùng CÙNG commit với lượt A nếu xác nhận C chạy trên cùng trạng thái mã nguồn, và
      điền điểm LB thật vào message thay cho <x>/<y>.
  - id: C-khong-diem-LB
    muc: trung binh
    mo_ta: >-
      `leaderboard` của C để null. Nếu C đã nộp thì lấy điểm từ CodaLab điền vào đây VÀ vào
      experiments.csv (cột recall_lb/precision_lb). Nếu C chưa nộp thì ghi rõ là chưa nộp —
      một bài nộp không điểm và một bài chưa nộp là hai chuyện khác nhau.
  - id: khong-co-run-meta
    muc: trung binh
    mo_ta: >-
      Cả hai lượt không đi qua scripts/run_pipeline.py nên không có run_meta.json (exp_id,
      commit, stats retriever). Lượt sau nên chạy qua runner; file kê khai này là bản vá cho
      hai lượt ĐÃ chạy, không phải cách làm lâu dài.
  - id: nhanh-feat-pipeline-e2e-thut-lui
    muc: cao
    mo_ta: >-
      Chuỗi script sinh ra hai bài nộp này nằm trên `main`, không có trên `feat/pipeline-e2e`,
      và bản p4_fuse.py ở đó còn mất cờ `--w`. Đã khôi phục p4_fuse.py / p4_to_preds.py /
      p4_check_submission.py / p5_knn_fuse.py / docs/reproduce.md / RUN_PRIVATE_KNN.md từ main
      sang nhánh này. Trước khi nộp lượt tiếp theo, kiểm bạn đang đứng trên nhánh nào.
