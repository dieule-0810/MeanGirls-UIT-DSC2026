# kho chunk đã sinh ra nó. `docs/reproduce.md` §2 lo đúng nỗi lo này bằng vocab/nnz/avgdl;
# sha256 chặt hơn và rẻ hơn.
inputs:
  data/chunks.jsonl:
    sha256: 34b426dd01cc202754d7d75ee1905c4a0e8e68476f16f674d376889b56bdf42a
    bytes: 576070530
    ghi_chu: 524.422 chunk / 8.507 doc — chunker mặc định (--chunk-size 256 --overlap 64)
  data/corpus_clean.jsonl:
    sha256: 365306b58c0c14e87adce81a2b383a2245002faacb41b95928ddff4db0d73945
    bytes: 445101520
  data/private-official.json:
    sha256: 9da4e0cb84204fed924251c35744c93879556e67a440332015ea3b62f3c355bc
    bytes: 388922
    ghi_chu: 2.080 câu, không nhãn
  data/train.json:
    sha256: c39cde9e74977e350f1456e7d487aafe67d2bcbaa4fa26fcabd557fe635635b7
    bytes: 1526741
    ghi_chu: 7.000 câu — bộ nhớ kNN của lượt A (KHÔNG phải train_split 4.689)
  configs/v0.3_bm25_best.yaml:
