# ── Hai bước đầu dùng chung cho cả A lẫn C ───────────────────────────────────
shared_steps:
  - id: bm25_top50
    cmd: >-
      py -m scripts.p4_build_ranking --config configs/v0.3_bm25_best.yaml
      --questions data/private-official.json
      --out outputs/v0.6_private/bm25_top50.json --top-k 50
    out: outputs/v0.6_private/bm25_top50.json
    chi_phi: ~7 phút CPU
  - id: bge_top20
    cmd: >-
      py -m scripts.p4_rerank --model bge-m3
      --ranking outputs/v0.6_private/bm25_top50.json
      --questions data/private-official.json --rerank-top 20 --chunks 1
      --prepend-name --batch-size 8 --out outputs/v0.6_private/bge_top20.json
    out: outputs/v0.6_private/bge_top20.json
    chi_phi: ~75 phút GPU (RTX 3050 6 GB, fp16)
    ghi_chu: >-
      BAAI/bge-reranker-v2-m3, revision 953dc6f6f85a, 567.755.777 tham số — dưới trần 4 tỷ
      của BTC. Kiểm toán: docs/param_audit.md.

runs:
  # ───────────────────────────────────────────────────────────────────────────
  A:
    mo_ta: BM25 + bge-reranker + kNN câu-hỏi-trên-train, hợp nhất RRF ba nguồn
    tag: submission/2026-09-23-knn-rrf
    commit: bdfedf86a03acf9b6ee7aa84a9a266a28304b64e
    leaderboard:
      recall: 0.881807453
      precision: 0.188366212
      nguon: message của git tag
    holdout_du_bao: {truoc: 0.8559, sau: 0.8917}
    steps:
      - id: knn_rrf
        cmd: >-
          py -m scripts.p5_knn_fuse --questions data/private-official.json
          --memory data/train.json --bm25 outputs/v0.6_private/bm25_top50.json
          --rerank outputs/v0.6_private/bge_top20.json
          --out outputs/v0.6_private/knn_rrf.json
        out: outputs/v0.6_private/knn_rrf.json
        sieu_tham_so: wb=0.6 wr=0.4 wk=0.10 rrf_k=60 neighbors=50 knn_depth=10 bm25_depth=50
        ghi_chu: >-
          Siêu tham số chọn trên dev, holdout chạm một lần. Mặc định trong p5_knn_fuse.py,
          không truyền cờ nào — nên bản committed của file đó LÀ đặc tả của bước này.
      - id: preds_A
        cmd: >-
          py -m scripts.p4_to_preds --ranking outputs/v0.6_private/knn_rrf.json
          --questions data/private-official.json --out outputs/v0.6_private/preds_A.json
        out: outputs/v0.6_private/preds_A.json
      - id: submission_A
        cmd: >-
          py -m src.make_submission --preds outputs/v0.6_private/preds_A.json
          --questions data/private-official.json --corpus data/corpus_clean.jsonl
          --out outputs/v0.6_private/A/submission.zip
        out: outputs/v0.6_private/A/submission.zip
    artifacts:
      outputs/v0.6_private/knn_rrf.json:
        sha256: c07d663204a05c78c68854ea1822ab9e2ce8e528d7f3e4c01f9a6670a75eb16e
        bytes: 4434600
      outputs/v0.6_private/preds_A.json:
        sha256: a01a52f8a8e0b2d59eb4f0389cd1a6796934b793716ad9fc6960486374ba09f7
        bytes: 223872
      outputs/v0.6_private/A/submission.zip:
        sha256: 1024ed4174db90e3c9667b9079fc73b9f50768738219e5c45b5de20830c9c2ce
        bytes: 44733
        # zip mang dấu thời gian nên hash của nó KHÔNG tái lập được giữa hai lần chạy.
        # Hash của file bên trong thì có — đó mới là thứ BTC chấm.
        inner:
          submission.json:
            sha256: d608a997580df6149059d5deb480d2670e9acfc6fc7ef813aaf53081f1cee65c
            bytes: 200689

  # ───────────────────────────────────────────────────────────────────────────
  C:
    mo_ta: BM25 + bge-reranker, hợp nhất RRF hai nguồn w=0,6 (không kNN)
    tag: null          # ⚠️ CHƯA CÓ TAG — xem `van_de` ở cuối file
    commit: null       # không xác định được từ repo; xem `bang_chung` bên dưới
    leaderboard:
      recall: null     # ⚠️ chưa điền; nếu đã nộp thì lấy từ CodaLab và điền vào đây
      precision: null
    steps:
      - id: rrf_w06
        cmd: >-
          py -m scripts.p4_fuse --bm25 outputs/v0.6_private/bm25_top50.json
          --rerank outputs/v0.6_private/bge_top20.json
          --questions data/private-official.json --top-k 20 --w 0.6 --rrf-k 60
          --out outputs/v0.6_private/rrf_w06.json
        out: outputs/v0.6_private/rrf_w06.json
        ghi_chu: >-
          `--w 0.6` BẮT BUỘC. Bỏ cờ này thì p4_fuse quét w trên chính tập private — tune trên
          tập thi. Bản p4_fuse.py trên nhánh feat/pipeline-e2e từng MẤT cờ này (đã khôi phục
          từ main); nếu lệnh trên báo `unrecognized arguments: --w` thì bạn đang ở bản cụt.
      - id: preds_C
        cmd: >-
          py -m scripts.p4_to_preds --ranking outputs/v0.6_private/rrf_w06.json
          --questions data/private-official.json --out outputs/v0.6_private/preds_C.json
        out: outputs/v0.6_private/preds_C.json
      - id: submission_C
        cmd: >-
          py -m src.make_submission --preds outputs/v0.6_private/preds_C.json
          --questions data/private-official.json --corpus data/corpus_clean.jsonl
          --out outputs/v0.6_private/C/submission.zip
        out: outputs/v0.6_private/C/submission.zip
    artifacts:
      outputs/v0.6_private/rrf_w06.json:
        sha256: 0543f0301939fcae97c105780b566f9cf02401c0732d390bde30f2419a8c0494
