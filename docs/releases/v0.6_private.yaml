# Kê khai bài nộp private test v0.6 — 23/09/2026.
#
# VÌ SAO CÓ FILE NÀY. `plan.md` §1 yêu cầu mọi submission thật sinh ra từ một Git tag. Lượt A có
# tag; lượt C không có. Và cả hai đều KHÔNG có `run_meta.json`, vì chúng được ghép tay bằng chuỗi
# script `p4_*`/`p5_*` chứ không qua `scripts/run_pipeline.py`. `outputs/` lại nằm trong
# `.gitignore` (dòng `outputs/*`), nên không có chỗ nào trong repo ghi lại rằng hai file zip đang
# cầm trên tay được sinh ra từ cái gì. File này là chỗ đó.
#
# Kiểm bằng:  python scripts/verify_release.py --manifest docs/releases/v0.6_private.yaml
# Ghi lại:    python scripts/verify_release.py --manifest ... --record   (sau khi chạy lại)
#
# ⚠️ Kê khai KHÔNG PHẢI tái lập. Nó chứng minh "các file trên đĩa vẫn đúng là các file đã nộp"
# và "lệnh nào sinh ra chúng", chứ không tự chạy lại chuỗi 80 phút GPU. Muốn tái lập thật thì
# chạy lại theo `commands` rồi so `sha256` — `--record` có để ghi kết quả lần chạy lại đó.
schema: 1
release: v0.6_private
ngay: 2026-09-23
nguoi_chay: P4
tap_thi: private test (3 lượt/ngày)

# ── Đầu vào dùng chung cho cả hai lượt ────────────────────────────────────────
