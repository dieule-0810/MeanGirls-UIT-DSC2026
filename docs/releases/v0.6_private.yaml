      outputs/v0.6_private/preds_C.json:
        sha256: 5c154d6084b4e9f99c1f795e0ffdde1f2c11109ebf7114196ecf19f3d71c18d7
        bytes: 223941
      outputs/v0.6_private/C/submission.zip:
        sha256: 8bc4e3a17f5b6002df14f82ec45cb8cc95a91f01d3e3ca352abaf1e2870ba039
