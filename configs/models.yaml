# configs/models.yaml — danh sách model đăng ký với BTC, đã pin revision.
#
# Vì sao pin revision: tác giả trên HuggingFace có thể cập nhật repo bất cứ lúc nào.
# Không pin thì kết quả tái lập của BTC lệch so với kết quả team báo cáo, và không ai
# tìm ra nguyên nhân. Đây là dòng "Model HF bị tác giả cập nhật giữa chừng" trong bảng
# rủi ro (plan.md mục 7).
#
# Cách dùng:
#     from transformers import AutoModel
#     AutoModel.from_pretrained(cfg["repo"], revision=cfg["revision"])
# Bỏ tham số `revision` = vi phạm quy tắc tái lập của team.
#
# Kiểm toán tham số: docs/param_audit.md (P4, 13/08/2026)
# Ngân sách BTC: tổng toàn pipeline < 4.000M, tính cả lớp embedding.

budget:
  max_total_params: 4_000_000_000
  note: >
    Tính tổng mọi thành phần có tham số học được trong pipeline nộp bài:
    bi-encoder + reranker + (ensemble nếu có). BM25 không có tham số học được
    nhưng vẫn khai trong Model Card.

