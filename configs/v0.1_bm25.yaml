# v0.1 — BM25 baseline đầu tiên: tokenizer regex, gộp max, không cắt ứng viên. BẢN CHUẨN để
# tái lập con số v0.1 (dev R@5 0,7863 · R@50 0,9503 trên kho 524.422 chunk).
#
# `pool: max` đã bị loại ở mọi chế độ (INTERFACES.md §3b) — file này chỉ còn để tái lập.
extends: base.yaml
exp_id: v0.1_bm25

paths:
  out_dir: outputs/v0.1_bm25

pipeline:
  retriever: bm25

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    pool: max
    tokenizer: regex
    tokenizer_opts:
      fold_tone: false
    candidate_chunks: null  # null = không cắt ứng viên, đúng hành vi v0.1
