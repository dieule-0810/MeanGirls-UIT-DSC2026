# v0.8-demo — KHÔNG PHẢI THÍ NGHIỆM. Config khói cho `src/retrieval/hybrid.py`.
#
# Hai nguồn đều là BM25, chỉ khác tokenizer, nên chạy được trên máy CHƯA CÀI TORCH và chưa có
# `data/embeddings.npy`. Cấu hình thật để đo là `configs/v0.8_hybrid_rrf.yaml` (BM25 + dense).
#
# ⚠️ ĐỪNG ghi kết quả chạy từ file này vào experiments.csv: hai tokenizer cùng nhìn một tín
# hiệu từ vựng nên bất đồng ít, RRF không có gì để hoà giải.
#
#     python scripts/run_pipeline.py --config configs/v0.8_hybrid_demo.yaml --demo --eval
#     python scripts/tune_rrf.py     --config configs/v0.8_hybrid_demo.yaml --demo
extends: base.yaml
exp_id: v0.8_hybrid_demo

paths:
  out_dir: outputs/v0.8_hybrid_demo

pipeline:
  retriever: hybrid

retrieval:
  hybrid:
    fuse_level: chunk
    rrf_k: 60
    absent_rank: null
    doc_depth: 200
    source_depth: null
    pool: mean_top2
    pool_tau: 1.0
    candidate_chunks: 500
    sources:
      sylbigram:
        extends: v0.3_bm25_best.yaml#retrieval.bm25
        type: bm25
        weight: 0.6
        candidate_chunks: 500
        verbose: false
      whitespace:
        type: bm25
        weight: 0.4
        k1: 1.5
        b: 0.75
        tokenizer: whitespace
        pool: mean_top2
        candidate_chunks: 500
        verbose: false

tune_rrf:
  grid_w: "0:1:0.25"
  grid_k: "20,60"
  levels: "chunk,doc"
