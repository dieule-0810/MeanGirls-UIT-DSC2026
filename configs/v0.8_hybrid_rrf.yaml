# v0.8 — PIPELINE CHÍNH THỨC HIỆN TẠI: hợp nhất BM25 + dense bằng RRF mức doc, rồi bộ quyết
# định số lượng doc. Kho chunk: chunker_dieu (432.142 chunk) — xem cảnh báo trong base.yaml.
#
# Giả thuyết H4: hợp nhất THỨ HẠNG giữ bề rộng của BM25 và lấy phần đỉnh của dense; cộng ĐIỂM
# thì không, vì hai thang không so được (BM25 dương không chặn trên, cosine ∈ [−1,1]).
#
# Siêu tham số CHỌN trên train_split, BÁO CÁO một lần trên dev (`scripts/tune_rrf.py`,
# outputs/v0.8_hybrid_rrf/tune_rrf.md). Lưới w 0..1 × rrf_k {20,60,100} × mức {chunk,doc}:
#     ô chọn: fuse_level=doc · rrf_k=20 · w_bm25=0,4 · w_dense=0,6
#     dev    : R@5 0,9384 · R@20 0,9786 · R@50 0,9857   (độ lạc quan nếu quét trên dev: +0,0050)
#     so với : BM25 một mình 0,8547 · dense một mình 0,9234
#
# θ calibrate = 0,502793 fit trên train_split với ngân sách recall 0,003
# (`scripts/fit_calibration.py`, outputs/v0.8_hybrid_doc/calibration.json). Trên dev:
#     cơ sở      recall 0,9384 · precision 0,1984
#     hiệu chỉnh recall 0,9354 · precision 0,2451  (×1,24) · ΔR −0,0030 KTC95 [−0,0065, −0,0005]
#
# ⚠️ θ gắn với đúng loại ranking này. Đổi nguồn, trọng số hay rrf_k ⇒ fit lại θ.
extends: base.yaml
exp_id: v0.8_hybrid_rrf

paths:
  out_dir: outputs/v0.8_hybrid_rrf

pipeline:
  retriever: hybrid
  calibrate:
    thresholds: 0.502793
    max_count: 5           # trần cứng của BTC
    min_count: 1
    scale_rank: 10         # mẫu số margin = s_1 − s_10

retrieval:
  hybrid:
    fuse_level: doc
    rrf_k: 20
    doc_depth: 200
    source_depth: null
    pool: max              # fuse_level=doc bắt buộc max (mỗi nguồn đã tự gộp chunk→doc)
    pool_tau: 1.0
    candidate_chunks: 2000
    sources:
      # Nguồn ĐẦU TIÊN là nguồn `tune_rrf.py --grid-w` quét trọng số; các nguồn còn lại chia
      # phần còn lại theo tỉ lệ. BM25 đứng đầu vì nó rẻ, không cần GPU.
      bm25:
        extends: v0.3_bm25_best.yaml#retrieval.bm25
        type: bm25
        weight: 0.4
      dense:
        extends: v0.4_dense.yaml#retrieval.dense
        type: dense
        weight: 0.6

tune_rrf:
  grid_w: "0:1:0.1"
  grid_k: "20,60,100"
  levels: "chunk,doc"
  select_on: "recall@5"
  recall_at: "5,20,50"
