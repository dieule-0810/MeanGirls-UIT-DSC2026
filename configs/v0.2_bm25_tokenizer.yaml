# v0.2 — Lưới BM25 tokenizer × gộp chunk→doc (P3, KPI Recall@50). Dùng với
# `scripts/bench_retrieval.py`; khối `bench` quyết định lưới, `tokenizer`/`pool` ở dưới chỉ là
# giá trị khi chạy file này đơn lẻ.
#
# Giả thuyết H1: word-segment (pyvi/underthesea) tăng Recall@50 so với âm tiết thuần, vì term
# ghép ("cơ_quan") hiếm hơn → IDF cao hơn → ít khớp nhiễu.
# Giả thuyết H1b: phần lớn mức tăng đó lấy lại được bằng bigram âm tiết, KHÔNG cần dependency.
# Giả thuyết H2: gộp mean_topN/logsumexp vượt max, vì văn bản đúng khớp ở nhiều điều khoản.
#
# Kết quả: docs/bench_v0.2_tokenizer.md — syllable_bigram + mean_top2 thắng (→ v0.3_bm25_best).
extends: v0.3_bm25_best.yaml
exp_id: v0.2_bm25_tok

paths:
  out_dir: outputs/v0.2_bm25_tok

retrieval:
  bm25:
    tokenizer: regex
    pool: logsumexp

bench:
  tokenizers: [regex, whitespace, syllable_bigram, pyvi, underthesea]
  pools: [max, mean_top2, mean_top3, logsumexp, sum]
  recall_at: [5, 20, 50, 100]
  n_questions: null
