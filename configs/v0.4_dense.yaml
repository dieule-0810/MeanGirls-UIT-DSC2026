# v0.4 — Dense bi-encoder zero-shot (P3, KPI Recall@50). Khối `retrieval.dense` ở đây là BẢN
# CHUẨN mà nguồn `dense` của hybrid kế thừa.
#
# Giả thuyết H3: biểu diễn dày bắt được nhóm lỗi R-TERM (câu hỏi dùng từ thường dân, văn bản
# dùng thuật ngữ pháp lý) mà BM25 không khớp được vì không trùng token. Kỳ vọng mức tăng rơi
# vào ĐÚNG nhóm đó, KHÔNG rơi vào R-NUM (số hiệu văn bản) nơi BM25 vốn mạnh — kiểm bằng phân
# tầng lỗi, không chỉ bằng con số tổng.
#
# Đo được (dev n=1000, kho chunker_dieu, outputs/v0.8_hybrid_rrf/tune_rrf.md):
#     dense một mình R@5 0,9234 · R@20 0,9708 · R@50 0,9813
#
# ⚠️ Cần `data/embeddings.npy` encode sẵn (`scripts/encode_corpus.py`). Thiếu file thì
#    DenseRetriever tự encode tại chỗ toàn bộ kho chunk — đừng để việc đó xảy ra ngoài ý muốn.
extends: base.yaml
exp_id: v0.4_dense

paths:
  out_dir: outputs/v0.4_dense

pipeline:
  retriever: dense

retrieval:
  dense:
    repo: AITeamVN/Vietnamese_Embedding_v2
    revision: 18b44161e041bf1d3a333ab5144b5b7b93f914d2   # hash ĐẦY ĐỦ, configs/models.yaml
    pooling: cls            # họ BGE-M3 lấy vector dense ở CLS. Đổi sang mean là đổi model khác.
    normalize: true         # chuẩn hoá L2 ⇒ dot product = cosine
    query_prefix: ""        # họ BGE KHÔNG dùng prefix. E5 cần "query: "/"passage: ", Qwen3 cần
    passage_prefix: ""      # instruction — sai prefix tụt điểm ÂM THẦM, nên khai tường minh.
    trust_remote_code: false
    max_length: 512         # khớp lần encode; đổi = phải encode lại toàn kho
    batch_size: 32          # chunk; hạ xuống 8-16 nếu OOM trên MPS
    query_batch_size: 64
    device: auto            # auto → cuda > mps > cpu
    fp16: true              # chỉ áp dụng khi có GPU
    pool: mean_top2
    pool_tau: 1.0
    candidate_chunks: 2000  # ⚠️ cap KHÔNG trung tính với mean_topN — docs/candidate_cap_check.md

bench:
  pools: [max, mean_top2, mean_top3, logsumexp]
  recall_at: [5, 20, 50, 100]
  n_questions: null
