# v0.7 — BM25 chốt (v0.3) + bộ quyết định số lượng doc (P4). Khác v0.3_bm25_best: thêm
# khối `pipeline.calibrate`.
#
# Giả thuyết H7: 92,1% câu chỉ có MỘT văn bản đáp án ⇒ "luôn nộp 5" bỏ không 4/5 precision
# để mua bảo hiểm recall. Khe hở điểm đã chuẩn hoá giữa các hạng đủ để nhận ra những câu
# KHÔNG cần bảo hiểm đó. Recall là metric chính nên precision chỉ được mua bằng recall trong
# ngân sách khai trước (0,003).
#
# θ = 0,712481 fit trên train_split (n=4689), KHÔNG fit trên dev. Đo trên dev n=1000, kho
# 524.422 chunk:
#     cơ sở      recall 0,8555 · precision 0,1792 · 5,00 doc/câu
#     hiệu chỉnh recall 0,8530 · precision 0,2462 · 4,63 doc/câu   (×1,37 precision)
#     ΔRecall = −0,0025, KTC95 cặp [−0,0055, +0,0000], 3/1000 câu xấu đi
#
# ⚠️ θ GẮN VỚI ĐÚNG LOẠI RANKING ĐÃ FIT (và đúng kho chunk). Đổi tầng đứng trước ⇒ fit lại.
extends: v0.3_bm25_best.yaml
exp_id: v0.7_bm25_calib

paths:
  out_dir: outputs/v0.7_bm25_calib

pipeline:
  calibrate:
    thresholds: 0.712481   # vectơ hằng; fit bằng scripts/fit_calibration.py trên train_split
    max_count: 5           # trần cứng của BTC, vượt là 0 điểm im lặng
    min_count: 1
    scale_rank: 10         # mẫu số = s_1 − s_10, tức bề rộng phổ điểm của chính câu đó
