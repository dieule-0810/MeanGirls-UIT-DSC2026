# v0.5 — Dense trên kho chunk theo Điều đặt ở tên RIÊNG (`data/chunks_dieu.jsonl`).
# Khác v0.4_dense đúng MỘT dòng: `paths.chunks`.
#
# Embedding đã encode trên Kaggle là của kho này (vân tay khớp, 432.142 chunk). Từ v0.8 kho
# này đã được đặt thẳng vào `data/chunks.jsonl`, nên v0.4_dense.yaml chạy được luôn; file này
# chỉ còn để tái lập các lần đo v0.5 khi hai kho còn nằm cạnh nhau.
#
# ⚠️ Đổi kho chunk ⇒ BM25 index lại, θ calibrate fit lại, `candidate_chunks` quét lại
#    (`scripts/check_candidate_cap.py`). Đừng bê số của kho cũ sang.
extends: v0.4_dense.yaml
exp_id: v0.5_dense_dieu

paths:
  chunks:  data/chunks_dieu.jsonl
  out_dir: outputs/v0.5_dense_dieu
