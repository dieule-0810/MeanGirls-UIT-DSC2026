# v0.5_chunk_dieu — ĐO THỬ chunking theo Điều. Khác v0.3_bm25_best ĐÚNG MỘT DÒNG:
# `paths.chunks` (cộng `n_jobs` cho máy ít nhân, không đổi kết quả).
#
# Dựng kho: `python -m src.data.chunker_dieu` → data/chunks_dieu.jsonl (432.142 chunk, 8.507 doc).
# So với kho mặc định (524.422 chunk, cửa sổ 256 từ / chồng 64):
#   - cắt theo ranh giới "Điều N." thay vì cửa sổ từ cố định;
#   - chunk nối tiếp được gắn tiền tố "[Điều N. - tiếp theo]"; bỏ tiền tố thì 100% chunk là
#     chuỗi con nguyên văn của văn bản gốc ⇒ không phải dữ liệu ngoài, không phải augmentation;
#   - trung bình 209 từ/chunk so với 167.
#
# Kết quả: dev −0,0008 (14-16, p=0,86) · holdout +0,0027 (21-17, p=0,63) — không phân biệt
# được ở BM25. Kho này được chọn cho v0.8 vì embedding dense đã encode trên nó.
extends: v0.3_bm25_best.yaml
exp_id: v0.5_chunk_dieu

paths:
  chunks:  data/chunks_dieu.jsonl
  out_dir: outputs/v0.5_chunk_dieu

retrieval:
  bm25:
    n_jobs: 4
