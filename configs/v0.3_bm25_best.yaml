# v0.3_bm25_best — BM25 chốt: syllable_bigram + mean_top2. Khối `retrieval.bm25` ở đây là
# BẢN CHUẨN mà mọi config BM25 khác và nguồn `bm25` của hybrid kế thừa.
#
# Dựng lại 14/09/2026 (P4) từ `run_meta.retriever` vì bản gốc chưa từng được commit; xác nhận
# 16/09 bằng một lần dựng chỉ mục đầy đủ trên kho 524.422 chunk: vocab 1.212.503 ·
# nnz 96.134.846 · avgdl 310 — trùng khít run_meta.
#
# `fold_tone: true` khôi phục bằng ĐO: tách từ lại toàn bộ kho với cả hai giá trị, chỉ `true`
# cho vocab 1.212.503 (`false` cho 1.215.933). Ablation tách đôi khoản +0,0439
# (regex→syllable_bigram VÀ fold_tone): configs/v0.3_sylbigram_notonefold.yaml.
#
# Số đo (dev n=1000):
#     kho 524.422 chunk (chunker mặc định) : R@5 0,8555 · R@20 0,9427 · R@50 0,9700
#     kho 432.142 chunk (chunker_dieu)     : R@5 0,8547 · R@20 0,9450 · R@50 0,9708
extends: base.yaml
exp_id: v0.3_bm25_best

paths:
  out_dir: outputs/v0.3_bm25_best

pipeline:
  retriever: bm25

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    tokenizer: syllable_bigram
    tokenizer_opts:
      fold_tone: true
      min_len: 1
    pool: mean_top2
    pool_tau: 1.0
    min_df: 1
    candidate_chunks: 2000   # ⚠️ không trung tính với mean_topN — docs/candidate_cap_check.md
    n_jobs: 8
    batch_size: 64
